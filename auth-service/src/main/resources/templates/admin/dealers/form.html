<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi"
      th:with="active='dealers', pageTitle=${formTitle} ?: 'Thêm Đại Lý Mới'"
      th:replace="~{layout :: layout(~{::content})}">
<body>
<div th:fragment="content">

    <div class="d-flex align-items-center justify-content-between mb-4">
        <div>
            <h2 class="h3 fw-bold text-white mb-1" th:text="${formTitle} ?: 'Thêm Đại Lý Mới'">Thêm Đại Lý Mới</h2>
            <p class="text-muted mb-0">Cấu hình thông tin đại lý ủy quyền và thông tin liên hệ showroom.</p>
        </div>
        <a class="btn btn-glass" th:href="@{/admin/dealers}">
            <i class="fa-solid fa-arrow-left me-1"></i> Quay lại
        </a>
    </div>

    <div class="row justify-content-center">
        <div class="col-lg-10">
            <div class="glass-card p-4 p-md-5">
                <form th:object="${dealer}" th:action="${formAction}" method="post">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label text-white fw-semibold">Mã Đại Lý *</label>
                            <input type="text" class="form-control-glass" th:field="*{code}" placeholder="VD: DLR01" required />
                        </div>
                        <div class="col-md-8">
                            <label class="form-label text-white fw-semibold">Tên Đại Lý *</label>
                            <input type="text" class="form-control-glass" th:field="*{name}" placeholder="VD: VinFast Thăng Long" required />
                        </div>

                        <div class="col-md-4">
                            <label class="form-label text-white fw-semibold">Khu Vực</label>
                            <input type="text" class="form-control-glass" th:field="*{region}" placeholder="VD: Miền Bắc" />
                        </div>
                        <div class="col-md-4">
                            <label class="form-label text-white fw-semibold">Số Điện Thoại</label>
                            <input type="text" class="form-control-glass" th:field="*{phone}" placeholder="VD: 0901234567" />
                        </div>
                        <div class="col-md-4">
                            <label class="form-label text-white fw-semibold">Email Liên Hệ</label>
                            <input type="email" class="form-control-glass" th:field="*{email}" placeholder="VD: info@thanglong.vinfast.vn" />
                        </div>

                        <div class="col-12">
                            <label class="form-label text-white fw-semibold">Địa Chỉ Chi Tiết (Dòng 1)</label>
                            <input type="text" class="form-control-glass" th:field="*{addressLine1}" placeholder="VD: Số 68 Đường Phạm Văn Đồng" />
                        </div>

                        <div class="col-md-4">
                            <label class="form-label text-white fw-semibold">Phường / Xã</label>
                            <input type="text" class="form-control-glass" th:field="*{ward}" placeholder="VD: Mai Dịch" />
                        </div>
                        <div class="col-md-4">
                            <label class="form-label text-white fw-semibold">Quận / Huyện</label>
                            <input type="text" class="form-control-glass" th:field="*{district}" placeholder="VD: Cầu Giấy" />
                        </div>
                        <div class="col-md-4">
                            <label class="form-label text-white fw-semibold">Tỉnh / Thành Phố</label>
                            <input type="text" class="form-control-glass" th:field="*{province}" placeholder="VD: Hà Nội" />
                        </div>

                        <div class="col-md-6">
                            <label class="form-label text-white fw-semibold">Trạng Thái Hoạt Động</label>
                            <select class="form-select-glass" th:field="*{status}">
                                <option value="ACTIVE">ACTIVE (Đang hoạt động)</option>
                                <option value="INACTIVE">INACTIVE (Tạm ngưng)</option>
                            </select>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-3 mt-4 pt-3" style="border-top: 1px solid rgba(255, 255, 255, 0.08);">
                        <a class="btn btn-glass px-4" th:href="@{/admin/dealers}">Hủy Bỏ</a>
                        <button class="btn-electric px-4" type="submit">
                            <i class="fa-solid fa-floppy-disk me-1"></i> Lưu Đại Lý
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

</div>
</body>
</html>
