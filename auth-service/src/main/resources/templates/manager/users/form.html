<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi"
      th:with="active='staff', pageTitle='Tạo Tài Khoản Nhân Viên Mới'"
      th:replace="~{layout :: layout(~{::content})}">
<body>
<div th:fragment="content">

    <!-- Breadcrumb & Navigation -->
    <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4">
        <div>
            <div class="d-flex align-items-center gap-2 mb-2">
                <a th:href="@{/manager/users}" class="text-muted text-decoration-none">
                    <i class="fa-solid fa-arrow-left me-1"></i> Danh sách nhân viên
                </a>
                <span class="text-muted">/</span>
                <span class="text-info fw-semibold">Tạo tài khoản mới</span>
            </div>
            <h2 class="h3 fw-bold text-white mb-0">
                <i class="fa-solid fa-user-plus text-info me-2"></i>
                Tạo Tài Khoản Nhân Viên Tư Vấn (Staff)
            </h2>
        </div>
        <div>
            <a th:href="@{/manager/users}" class="btn-ghost">
                <i class="fa-solid fa-xmark me-1"></i> Hủy Bỏ
            </a>
        </div>
    </div>

    <!-- Form Glass Card -->
    <div class="row justify-content-center">
        <div class="col-xl-7 col-lg-9">
            <div class="glass-card p-4 p-md-5">
                <form th:action="@{/manager/users/create}" method="post" th:object="${user}">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                    <div class="mb-4">
                        <label class="form-label-custom">Tên Đăng Nhập (Username) <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text bg-transparent" style="border-color: rgba(255,255,255,0.1); color: #94a3b8;">
                                <i class="fa-solid fa-user"></i>
                            </span>
                            <input type="text" th:field="*{username}" class="form-control-custom" placeholder="Ví dụ: staff_hanoi01" required />
                        </div>
                        <small class="text-muted">Tên tài khoản dùng để đăng nhập vào cổng thông tin đại lý.</small>
                    </div>

                    <div class="mb-4">
                        <label class="form-label-custom">Mật Khẩu Đăng Nhập <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text bg-transparent" style="border-color: rgba(255,255,255,0.1); color: #94a3b8;">
                                <i class="fa-solid fa-lock"></i>
                            </span>
                            <input type="password" th:field="*{password}" class="form-control-custom" placeholder="••••••••" required />
                        </div>
                        <small class="text-muted">Tối thiểu 6 ký tự bảo mật.</small>
                    </div>

                    <div class="mb-4">
                        <label class="form-label-custom">Họ và Tên Đầy Đủ <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text bg-transparent" style="border-color: rgba(255,255,255,0.1); color: #94a3b8;">
                                <i class="fa-solid fa-id-badge"></i>
                            </span>
                            <input type="text" th:field="*{fullName}" class="form-control-custom" placeholder="Ví dụ: Hoàng Minh Đức" required />
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label-custom">Địa Chỉ Email Làm Việc <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text bg-transparent" style="border-color: rgba(255,255,255,0.1); color: #94a3b8;">
                                <i class="fa-solid fa-envelope"></i>
                            </span>
                            <input type="email" th:field="*{email}" class="form-control-custom" placeholder="Ví dụ: duc.hoang@evdms.com" required />
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-3 pt-3" style="border-top: 1px solid rgba(255,255,255,0.08);">
                        <a th:href="@{/manager/users}" class="btn-ghost">
                            Hủy Bỏ
                        </a>
                        <button type="submit" class="btn-electric">
                            <i class="fa-solid fa-check me-1"></i> Tạo Tài Khoản Staff
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

</div>
</body>
</html>
