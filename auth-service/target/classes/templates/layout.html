<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="vi"
      th:fragment="layout(content)">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle != null ? pageTitle + ' • EV-DMS' : 'EV-DMS • Quản Lý Bán Xe Điện'}">EV-DMS • Quản Lý Bán Xe Điện</title>

    <!-- ===== Google Fonts: Plus Jakarta Sans ===== -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- ===== Bootstrap 5.3.3 ===== -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <!-- ===== Font Awesome 6 (Local / CDN) ===== -->
    <link rel="stylesheet" th:href="@{/vendor/fontawesome/css/all.min.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- ===== EV-DMS Unified Design System ===== -->
    <link rel="stylesheet" th:href="@{/css/app-theme.css}">
</head>

<body>
<div class="app-background-mesh"></div>

<div class="page-wrapper">
    <!-- ===== Topbar ===== -->
    <header th:replace="~{fragments/topbar :: topbar}"></header>

    <!-- ===== Main Workspace ===== -->
    <div class="main-layout">
        <!-- Sidebar Router -->
        <aside th:replace="~{fragments/sidebar-router :: sidebar}"></aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <!-- Global Flash Messages (Toast Alerts) -->
            <div th:if="${successMessage != null or success != null}" class="alert alert-success alert-dismissible fade show mb-4 glass-panel border-success py-3" role="alert">
                <i class="fas fa-check-circle me-2 text-success"></i>
                <span th:text="${successMessage ?: success}">Thao tác thành công!</span>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <div th:if="${errorMessage != null or error != null}" class="alert alert-danger alert-dismissible fade show mb-4 glass-panel border-danger py-3" role="alert">
                <i class="fas fa-exclamation-triangle me-2 text-danger"></i>
                <span th:text="${errorMessage ?: error}">Đã có lỗi xảy ra!</span>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <!-- Page Insert Content -->
            <div th:insert="${content}"></div>
        </main>
    </div>
</div>

<!-- ===== Bootstrap 5.3.3 JS Bundle ===== -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Optional Script Insertion for child pages -->
<th:block th:insert="~{::script}"></th:block>

</body>
</html>
