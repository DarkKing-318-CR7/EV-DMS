server:
  port: 8081

spring:
  cloud:
    gateway:
      routes:

        - id: auth-service
          uri: http://localhost:9000
          predicates:
            - Path=/login,/logout,/post-login,/admin/**,/dealer/**,/evm/**,/manager/**,/staff/**,/reports,/reports/**,/support,/support/**,/css/**,/js/**,/image/**,/webjars/**
          filters:
            - StripPrefix=0

        - id: crm_service
          uri: http://localhost:9001
          predicates:
            - Path=/api/crm/**,/api/v1/crm/**,/crm/**
          filters:
            - StripPrefix=0

        - id: catalog-service
          uri: http://localhost:9002
          predicates:
            - Path=/api/catalog/**,/catalog/**
          filters:
            - StripPrefix=0

        # Route tới inventory-service (REST API)
        - id: inventory-service-api
          uri: http://localhost:9003
          predicates:
            - Path=/api/inventory/**,/api/admin/inventories/**
          filters:
            - StripPrefix=0

        - id: sales-service
          uri: http://localhost:9004
          predicates:
            - Path=/api/sales/**,/sales/**
          filters:
            - StripPrefix=0

        - id: order-service
          uri: http://localhost:9005
          predicates:
            - Path=/api/orders/**,/orders/**
          filters:
            - StripPrefix=0

        - id: report-service
          uri: http://localhost:9006
          predicates:
            - Path=/api/reports/**,/report/**
          filters:
            - StripPrefix=0

management:
  endpoints:
    web:
      exposure:
        include: "*"
